name: Publish easyclimate to PyPI

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  UnitTesting:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Avoid shallow clone for version detection

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r test_requirements.txt
          python -m pip install --no-deps -e .

      - name: Run unit tests
        run: pytest --mpl --mpl-baseline-path="test/baseline_images" --cov src

  BuildAndPublish:
    needs: UnitTesting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build setuptools wheel setuptools-scm
          pip install -r release_requirements.txt

      - name: Build package
        run: python -m build --no-isolation

      - name: Verify package versions match release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          from os import environ
          from pathlib import Path

          from packaging.utils import parse_sdist_filename, parse_wheel_filename

          expected_version = environ["RELEASE_TAG"].removeprefix("v")
          dist = Path("dist")
          for pattern, parse_filename in (
              ("*.whl", parse_wheel_filename),
              ("*.tar.gz", parse_sdist_filename),
          ):
              artifacts = list(dist.glob(pattern))
              if len(artifacts) != 1:
                  raise SystemExit(f"Expected one {pattern} in {dist}, got {artifacts}")
              artifact = artifacts[0]
              version = parse_filename(artifact.name)[1]
              if str(version) != expected_version:
                  raise SystemExit(f"{artifact.name} has version {version}, expected {expected_version}")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/

      - name: Upload build artifacts to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.event.release.tag_name }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
